agendoc:
  security:
    permit-development-endpoints: false
  cors:
    allowed-origins: ${AGENDOC_CORS_ALLOWED_ORIGINS}

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false