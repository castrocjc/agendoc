agendoc:
  security:
    jwt:
      issuer: ${AGENDOC_JWT_ISSUER:agendoc-api}
      secret: ${AGENDOC_JWT_SECRET}
      expiration-seconds: ${AGENDOC_JWT_EXPIRATION_SECONDS:3600}
  cors:
    allowed-origins: ${AGENDOC_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

spring:
  application:
    name: agendoc-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.agendoc: ${APP_LOG_LEVEL:DEBUG}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}